name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queue the newest, do not cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the things that quietly break
        run: |
          set -e
          test -f index.html          || { echo "::error::index.html is missing"; exit 1; }
          test -f .nojekyll           || { echo "::error::.nojekyll is missing"; exit 1; }
          test -f assets/video/nerd-lab-intro.mp4 || { echo "::error::brand video is missing"; exit 1; }
          # Every href/src in index.html must be relative or absolute-external, never root-relative:
          # this site has to survive being served from a subpath.
          if grep -Eo '(href|src)="/[^/]' index.html; then
            echo "::error::root-relative path found — it will 404 on a project Pages subpath"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
